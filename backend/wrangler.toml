name = "brews-bingo-api"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-05"
workers_dev = false

[build]
command = "worker-build --release"

[vars]
APP_ORIGIN = "https://localhost:8787"
# RATE_LIMIT_KEY is a required secret, supplied only in ephemeral tests here.
# Production KDF cost/capacity measurement and secret provisioning are not done.

[durable_objects]
bindings = [{ name = "ACCOUNTS", class_name = "AccountsObject" }, { name = "GAME_DIRECTORY", class_name = "GameDirectoryObject" }, { name = "GAMES", class_name = "GameObject" }]

[[migrations]]
tag = "accounts"
new_sqlite_classes = ["AccountsObject"]

[[migrations]]
tag = "directory"
new_sqlite_classes = ["GameDirectoryObject"]

[[migrations]]
tag = "games"
new_sqlite_classes = ["GameObject"]

# Remote targets are deliberately unprovisioned. Use deployment.py's validated
# generated config; never deploy this file directly to a remote account.
[env.staging]
name = "brews-bingo-api-staging"
workers_dev = false
preview_urls = false
routes = []
[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"
[env.staging.vars]
APP_ORIGIN = "https://brews-bingo-staging.invalid"
[env.staging.durable_objects]
bindings = [{ name = "ACCOUNTS", class_name = "AccountsObject" }, { name = "GAME_DIRECTORY", class_name = "GameDirectoryObject" }, { name = "GAMES", class_name = "GameObject" }]

[env.production]
name = "brews-bingo-api-production"
workers_dev = false
preview_urls = false
routes = []
[env.production.version_metadata]
binding = "CF_VERSION_METADATA"
[env.production.vars]
APP_ORIGIN = "https://brews-bingo-production.invalid"
[env.production.durable_objects]
bindings = [{ name = "ACCOUNTS", class_name = "AccountsObject" }, { name = "GAME_DIRECTORY", class_name = "GameDirectoryObject" }, { name = "GAMES", class_name = "GameObject" }]
