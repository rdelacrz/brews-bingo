[package]
name = "brews-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
brews-domain = { path = "../shared/domain" }
brews-contracts = { path = "../shared/contracts", features = ["management"] }
brews-config = { path = "../shared/config", features = ["backend"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
uuid.workspace = true
argon2.workspace = true
base64.workspace = true
sha2.workspace = true
hmac.workspace = true
subtle.workspace = true
http = "1.3"
axum = { version = "0.8.6", default-features = false, features = ["json"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "=0.8.7", features = ["http", "axum"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
tracing-web = "0.1.3"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json"] }

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json"] }

[lints]
workspace = true
