[workspace]
resolver = "3"
members = ["shared/domain", "shared/contracts", "shared/config", "backend"]
default-members = ["shared/domain", "shared/contracts", "shared/config", "backend"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zeroize = { version = "1.8", features = ["derive"] }
uuid = { version = "1.18", default-features = false, features = ["std", "serde"] }
envy = "0.4.2"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash"] }
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
subtle = "2.6"
url = "2.5"
strum = { version = "0.27", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
opt-level = "s"
overflow-checks = true

[profile.release-assertions]
inherits = "release"
debug-assertions = true
overflow-checks = true
