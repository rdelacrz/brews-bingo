[package]
name = "brews-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "brews"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
brews-domain = { path = "../shared/domain" }
brews-contracts = { path = "../shared/contracts", default-features = false, features = ["management"] }
brews-config = { path = "../shared/config", default-features = false, features = ["cli"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64.workspace = true
zeroize.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v7", "rng-getrandom"] }

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3.20"

[lints]
workspace = true
